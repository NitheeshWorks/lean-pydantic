# Traceability register: upstream behaviour -> Lean symbol -> theorem -> test.
#
# `scripts/traceability-check.py` validates it on every CI run: every
# `realises`/`theorem` symbol must resolve, every `test` path must exist.
#
# status: implemented | partial | tested | excluded | deviation
#   implemented  realised and proved
#   partial      realised, proof incomplete or covering a subset
#   tested       realised, deliberately tested rather than proved (say why)
#   excluded     out of scope, rejected by name
#   deviation    behaviour differs from upstream on purpose (say how)

[meta]
upstream_name = "pydantic, pydantic-core and annotated-types"
upstream_url = "https://github.com/pydantic/pydantic"
upstream_commit = "5adfeaaaea947f81f0f01868604f219084ec151a"
upstream_license = "MIT"

# [[requirement]]
# id = "..."                  # stable id, e.g. "routing.first-match"
# upstream = "tests/test_x.py::test_y"   # or a docs section
# title = "..."
# status = "implemented"
# realises = ["LeanPydantic.Foo.bar"]
# theorem = ["LeanPydantic.Foo.bar_spec"]
# test = ["tests/Conformance.lean::name"]

# ---------------------------------------------------------------- scalars

[[requirement]]
id = "validate.int"
upstream = "pydantic-core/tests/validators/test_int.py::test_int_py_and_json"
title = "int: JSON integers; lax floats, bools and strings (clean_int_str); strict JSON integers only"
status = "tested"
realises = ["LeanPydantic.Scalar.int", "LeanPydantic.Coerce.strAsInt", "LeanPydantic.Coerce.cleanIntStr", "LeanPydantic.Coerce.decimalAsInt"]
theorem = ["LeanPydantic.int_strict"]
test = ["tests/Conformance.lean::tableCases", "tests/Props.lean::properties", "tests/pbt/Pbt.lean"]
notes = "Coercions are a rule-for-rule port of pydantic-core shared.rs, checked byte for byte against pydantic on 160 inputs; there is no independent spec to prove them against."

[[requirement]]
id = "validate.non-negative-int"
upstream = "pydantic/tests/test_types.py::test_strict_raw_type"
title = "Nat is NonNegativeInt: int, then ge=0 (greater_than_equal, ctx ge 0); schema minimum 0"
status = "implemented"
realises = ["LeanPydantic.Scalar.nat"]
theorem = ["LeanPydantic.nat_strict"]
test = ["tests/Conformance.lean::tableCases"]

[[requirement]]
id = "validate.finite-float"
upstream = "pydantic-core/tests/validators/test_float.py::test_non_finite_json_values"
title = "Decimal is FiniteFloat (float, allow_inf_nan=False), held exactly"
status = "deviation"
realises = ["LeanPydantic.Scalar.float", "LeanPydantic.Coerce.strAsFloat"]
theorem = ["LeanPydantic.float_strict"]
test = ["tests/Conformance.lean::tableCases", "tests/Props.lean::properties"]
notes = "Deviation: values are exact decimals, not IEEE doubles, so 0.1 + 0.2 and over-precise or overflowing literals (1e400) keep their exact value where pydantic rounds or gives inf. NaN and infinities (lenient JSON, 'inf' strings) are finite_number, as FiniteFloat. Plain float is Float (IEEE binary64, row float.python)."

[[requirement]]
id = "validate.bool"
upstream = "pydantic-core/tests/validators/test_bool.py::test_bool"
title = "bool: str_as_bool words, 0/1 integers, 0.0/1.0 floats; strict bools only"
status = "tested"
realises = ["LeanPydantic.Scalar.bool", "LeanPydantic.Coerce.strAsBool"]
theorem = ["LeanPydantic.bool_strict"]
test = ["tests/Conformance.lean::tableCases"]

[[requirement]]
id = "validate.str"
upstream = "pydantic-core/tests/validators/test_string.py::test_str"
title = "str: JSON strings only (no number coercion)"
status = "implemented"
realises = ["LeanPydantic.Scalar.str"]
theorem = ["LeanPydantic.str_strict"]
test = ["tests/Conformance.lean::tableCases"]

[[requirement]]
id = "validate.nullable"
upstream = "pydantic-core/tests/validators/test_nullable.py::test_nullable"
title = "Optional[T]: null is None, anything else is T; schema anyOf [T, null]"
status = "implemented"
realises = ["LeanPydantic.fromJsonOption", "LeanPydantic.toJsonOption"]
theorem = ["LeanPydantic.nullable_anyOf", "LeanPydantic.schema_option", "LeanPydantic.fromJson_option_of_ne_null"]
test = ["tests/Conformance.lean::tableCases", "tests/pbt/Pbt.lean"]

# ------------------------------------------------------------ constraints

[[requirement]]
id = "constraints.refinement"
upstream = "pydantic/tests/test_types.py::test_constraints_arbitrary_type"
title = "Annotated[T, Field(gt, ge, lt, le, multiple_of, min_length, max_length)] is the refinement T | c over Keel's constraint language"
status = "implemented"
realises = ["LeanPydantic.fromJsonRefined", "Keel.Constraint.validatePy"]
theorem = ["LeanPydantic.fromJson_refined_iff", "LeanPydantic.fromJson_refined_error"]
test = ["tests/Conformance.lean::tableCases", "tests/pbt/Pbt.lean"]

[[requirement]]
id = "constraints.order"
upstream = "pydantic-core/tests/validators/test_int.py::test_int_kwargs"
title = "Constraints are checked in pydantic-core's order (multiple_of, le, lt, ge, gt; min_length, max_length) and the first failure is reported"
status = "implemented"
realises = ["Keel.Constraint.validatePy", "Keel.Constraint.rank", "Keel.Constraint.ordered"]
theorem = ["Keel.Constraint.validatePy_iff", "Keel.Constraint.validate_sound", "Keel.Constraint.validate_complete", "Keel.Constraint.validate_errors_nonempty"]
test = ["tests/Conformance.lean::tableCases", "tests/Props.lean::properties"]

[[requirement]]
id = "constraints.duplicate-atoms"
upstream = "pydantic/tests/test_types.py::test_constraints_arbitrary_type"
title = "A constraint given twice (ge 0 and ge 5) must hold both times; pydantic keeps only the last"
status = "deviation"
realises = ["Keel.Constraint.validatePy"]
notes = "The schema keeps pydantic's last-wins keyword (lastWins), which is weaker than the conjunction, so schema soundness is unaffected. Nat | ge 5 on input -1 reports ge 0 (the Nat base) where pydantic reports ge 5."

[[requirement]]
id = "constraints.keywords"
upstream = "pydantic/tests/test_json_schema.py::test_constraints_schema_validation"
title = "Each constraint's JSON Schema keywords (exclusiveMinimum, minimum, exclusiveMaximum, maximum, multipleOf, minLength, maxLength) hold on what strict validation accepts"
status = "implemented"
realises = ["Keel.Constraint.keywordsOf", "LeanPydantic.Constrained"]
theorem = ["Keel.Constraint.keywordsOf_sound", "LeanPydantic.numeric_keywords_sound", "LeanPydantic.check_withKeywords"]
test = ["tests/Conformance.lean::schemaCases"]
notes = "Holds for atoms built with the carrier's own instances (class Canonical, found automatically): Keel stores the order or length instance inside each atom."

[[requirement]]
id = "constraints.exact-numbers"
upstream = "pydantic-core/tests/validators/test_float.py::test_float_multiple_of"
title = "Numeric bounds and multiple_of compare exact values (float multiple_of has no tolerance)"
status = "deviation"
realises = ["LeanPydantic.Dec.rel", "LeanPydantic.Num.rel"]
theorem = ["LeanPydantic.Num.rel_at", "LeanPydantic.Num.rel_denotes", "LeanPydantic.Num.rel_int"]
test = ["tests/Conformance.lean::tableCases"]
notes = "pydantic-core's float multiple_of allows a relative tolerance of 1e-9; exact decimals need none. Bounds written as integral floats (gt=2.0) print as 2 in schemas and messages, as pydantic does for gt=2."

# ----------------------------------------------------------------- errors

[[requirement]]
