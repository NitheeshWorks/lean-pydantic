realises = ["LeanPydantic.Model.model_validate", "LeanPydantic.Model.model_dump"]
theorem = ["LeanPydantic.Model.model_validate_model_dump", "LeanPydantic.LawfulJson.fromJson_toJson"]
test = ["tests/Props.lean::properties", "tests/pbt/Pbt.lean"]
notes = "The JSON-text round trip (model_validate_json of model_dump_json) is tested in Props; it rests on LeanJson's from_json_to_json, whose integer-size and depth side conditions every dump of these types meets."

[[requirement]]
id = "model.schema"
upstream = "pydantic/tests/test_json_schema.py::test_constraints_schema_validation"
title = "model_json_schema(): properties in field order with titles and defaults, required, title, type; keys sorted as pydantic sorts them"
