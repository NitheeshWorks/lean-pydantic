  "LeanPydantic.Coerce.strAsInt", "LeanPydantic.Dec.ltCore", "LeanPydantic.Dec.dvdCore",
  "LeanPydantic.NumScan.numScan", "LeanPydantic.NumScan.digitsVal", "LeanPydantic.Coerce.strAsFloat",
  "LeanPydantic.Coerce.strAsNumber", "LeanPydantic.PyDecimal.parse", "LeanPydantic.Coerce.strAsDouble",
  "LeanPydantic.NumScan.DigAcc.trunc"]
theorem = ["LeanPydantic.dedupIdx_eq", "LeanPydantic.nodupFast_iff", "LeanPydantic.validateMembersFast_eq",
  "LeanPydantic.Dec.ltCore_iff", "LeanPydantic.Dec.dvdCore_iff", "LeanPydantic.Num.lt_iff_core",
  "LeanPydantic.Coerce.strAsInt_eq", "LeanPydantic.NumScan.numScan_eq", "LeanPydantic.NumScan.digitsVal_eq",
  "LeanPydantic.Coerce.strAsFloat_eq", "LeanPydantic.Coerce.strAsNumber_eq", "LeanPydantic.PyDecimal.parse_eq",
  "LeanPydantic.NumScan.DigAcc.trunc_spec", "LeanPydantic.Coerce.strAsDouble_exact"]
test = ["tests/Bench.lean::benches", "tests/Props.lean::properties"]
notes = "Bounds in tests/Bench.lean against pydantic-core 2.14.1 on the same machine; run by check.sh and CI. float from a string converts only the leading 769+ significant digits and a sticky digit (NumScan.DigAcc.trunc, trunc_spec; the equal double is tested on halfway cases, not proved: Lean's Float.Model rounding has no real-valued specification), so it is linear (13 ms per MiB, about 60x pydantic-core). PyDecimal and the exact Decimal keep a binary Nat coefficient: the base conversion is an O(M(n) log n) product tree, 2.1x per doubling, about 33x pydantic (libmpdec keeps base-10^19 limbs)."

[[requirement]]
id = "decimal.multiple-of-exact"
upstream = "pydantic-core/tests/validators/test_decimal.py::test_decimal_multiple_of"
title = "multiple_of on a Decimal is exact; Python divides at 28 digits and rejects wider quotients (UP-055, pydantic#13970)"
status = "deviation"
realises = ["LeanPydantic.Dec.IsMultiple", "LeanPydantic.Dec.dvdCore"]
theorem = ["LeanPydantic.Dec.isMultiple_iff_core", "LeanPydantic.Dec.dvdCore_iff"]
test = ["tests/Conformance.lean::handCases"]
notes = "pydantic-core computes (value / multiple_of) % 1 in the default 28-digit context, so Decimal('1e28') fails multiple_of=0.5 (https://github.com/pydantic/pydantic/issues/13970). Here divisibility is exact. The three inputs this changes (123456789012345678901234567890e5, 1e300, \"1e999999999\") are left out of the generated table and pinned to Lean's answer by a hand case."
