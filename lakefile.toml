name = "LeanPydantic"
version = "0.1.0"
defaultTargets = ["LeanPydantic", "ConformanceTable", "props", "conformance"]

# The verified library. Everything under LeanPydantic/ is a total function
# and the proof surface; see CONTRIBUTING.md.
[[lean_lib]]
name = "LeanPydantic"

# The pydantic-generated table the conformance runner replays
# (scripts/conformance/generate.py writes it).
[[lean_lib]]
name = "ConformanceTable"
roots = ["tests.ConformanceTable"]

# Property tests for what is tested rather than proved. Runs in well under a
# second: `lake exe props [seed]`.
[[lean_exe]]
name = "props"
root = "tests.Props"

# Conformance cases re-expressed from the upstream test suite:
# `lake exe conformance`. Each case names the upstream test it mirrors.
[[lean_exe]]
name = "conformance"
root = "tests.Conformance"

# Hostile-size benches with bounds near pydantic-core's own times:
# `lake exe bench`. Each prints its time and fails above its bound.
[[lean_exe]]
name = "bench"
root = "tests.Bench"

# The verification gate, compiled: `lake exe axioms LeanPydantic`.
# scripts/Axioms.lean is a byte-for-byte copy of stack-tools/Axioms.lean,
# pinned by scripts/Axioms.sha256; change it there first.
[[lean_exe]]
name = "axioms"
root = "scripts.Axioms"
supportInterpreter = true

[[require]]
name = "LeanJson"
git = "https://github.com/NitheeshWorks/lean-json"
rev = "main"

[[require]]
name = "Keel"
git = "https://github.com/NitheeshWorks/lean-keel"
rev = "main"
